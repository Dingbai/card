<div id="english-review-app" aria-label="English review card">
  <style>
    #english-review-app{color-scheme:light dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#172033,#eef2ff);width:100%;margin:0}#english-review-app *{box-sizing:border-box}#english-review-app .panel{display:flex;min-height:680px;flex-direction:column;background:light-dark(#fff,#171a23);border:1px solid light-dark(#dce2ee,#343948);border-radius:20px;overflow:hidden}#english-review-app .hero{padding:24px;background:light-dark(linear-gradient(135deg,#f7f9ff,#eef2ff),linear-gradient(135deg,#1d2230,#202640))}#english-review-app .kicker{margin:0 0 8px;color:light-dark(#315cff,#9fb2ff);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}#english-review-app h2{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.2}#english-review-app .source{margin:10px 0 0;color:light-dark(#5e687c,#b4bdd1);font-size:14px;line-height:1.55}#english-review-app .body{display:flex;flex:1;flex-direction:column;padding:24px}#english-review-app .start{display:grid;gap:18px;margin:auto;text-align:center}#english-review-app button{font:inherit;min-height:44px;border-radius:12px;padding:11px 18px;font-weight:500;cursor:pointer}#english-review-app .primary{border:0;color:#fff;background:#315cff}#english-review-app .primary:disabled{cursor:default;opacity:.55}#english-review-app .progress-row{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:light-dark(#5e687c,#b4bdd1);font-size:13px}#english-review-app .progress{height:7px;background:light-dark(#e7ebf3,#2a3040);border-radius:99px;overflow:hidden;margin-bottom:22px}#english-review-app .progress span{display:block;height:100%;background:#315cff}#english-review-app .type{color:light-dark(#315cff,#9fb2ff);font-size:12px;font-weight:500}#english-review-app .prompt{margin:8px 0 18px;font-size:20px;line-height:1.45}#english-review-app fieldset{display:grid;gap:10px;border:0;padding:0;margin:0 0 18px}#english-review-app .option{display:flex;gap:10px;padding:12px 14px;border:1px solid light-dark(#d7ddea,#41485a);border-radius:12px;cursor:pointer;line-height:1.4}#english-review-app .option:has(input:checked){border-color:#315cff;background:light-dark(#f1f4ff,#242c49)}#english-review-app input[type=radio]{margin-top:3px;accent-color:#315cff}#english-review-app .text{width:100%;min-height:46px;border:1px solid light-dark(#cfd6e5,#4a5266);border-radius:12px;padding:11px 13px;color:inherit;background:light-dark(#fff,#11141c);font:inherit;font-size:16px;margin-bottom:18px}#english-review-app textarea.text{min-height:92px;resize:vertical}#english-review-app .feedback{margin:16px 0;padding:14px;border-radius:12px;line-height:1.5}#english-review-app .feedback[data-correct=true]{background:light-dark(#eaf8f0,#173428);border:1px solid light-dark(#a9dfbe,#286846)}#english-review-app .feedback[data-correct=false]{background:light-dark(#fff0ef,#402221);border:1px solid light-dark(#f0b5b0,#7c3d39)}#english-review-app .feedback p{margin:5px 0}#english-review-app .actions{display:flex;justify-content:flex-end;gap:10px}#english-review-app .result{text-align:center;padding:8px 0 20px}#english-review-app .score{font-size:48px;font-weight:500;margin:8px 0 30px}#english-review-app .result-list{display:grid;gap:10px;text-align:left;margin:22px 0}#english-review-app .result-item{padding:12px 14px;border:1px solid light-dark(#dce2ee,#343948);border-radius:12px}#english-review-app .result-item p{margin:5px 0 0;color:light-dark(#5e687c,#b4bdd1);font-size:13px}#english-review-app .status{min-height:20px;margin-top:10px;color:light-dark(#5e687c,#b4bdd1);font-size:13px}#english-review-app [hidden]{display:none!important}@media(max-width:480px){#english-review-app .panel{min-height:720px}#english-review-app .hero,#english-review-app .body{padding:18px}#english-review-app .actions{flex-direction:column}#english-review-app .actions button{width:100%}}
    #english-review-app .panel{min-height:0}#english-review-app .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}#english-review-app .heading{min-width:0;flex:1}#english-review-app .metrics{margin:8px 0 0;color:light-dark(#69748a,#9ca8bf);font-size:12px;font-variant-numeric:tabular-nums}#english-review-app .settings-button{flex:0 0 auto;min-height:40px;border:1px solid light-dark(#cfd6e5,#4a5266);padding:9px 14px;color:inherit;background:light-dark(rgba(255,255,255,.72),rgba(17,20,28,.62))}#english-review-app .settings-button:disabled{cursor:default;opacity:.5}#english-review-app .settings{display:grid;gap:22px}#english-review-app .settings h3{margin:0;font-size:22px}#english-review-app .settings-group{display:grid;gap:10px;border:0;margin:0;padding:0}#english-review-app .settings-group legend{margin-bottom:10px;font-weight:600}#english-review-app .check{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid light-dark(#d7ddea,#41485a);border-radius:12px}#english-review-app .check input{width:18px;height:18px;accent-color:#315cff}#english-review-app .count{display:block;width:100%;min-height:46px;margin-top:8px;border:1px solid light-dark(#cfd6e5,#4a5266);border-radius:12px;padding:10px 12px;color:inherit;background:light-dark(#fff,#11141c);font:inherit;font-size:16px}#english-review-app .secondary{border:1px solid light-dark(#cfd6e5,#4a5266);color:inherit;background:transparent}#english-review-app .skeleton{display:grid;gap:16px;width:100%}#english-review-app .skeleton-line,#english-review-app .skeleton-block{border-radius:10px;background:light-dark(#e9edf5,#292f3e);background-image:linear-gradient(90deg,transparent,light-dark(rgba(255,255,255,.7),rgba(255,255,255,.07)),transparent);background-size:220% 100%;animation:review-card-shimmer 1.35s ease-in-out infinite}#english-review-app .skeleton-line{height:15px}#english-review-app .skeleton-line.short{width:38%}#english-review-app .skeleton-line.medium{width:68%}#english-review-app .skeleton-block{height:48px}#english-review-app .skeleton-status{margin:2px 0 0;color:light-dark(#69748a,#9ca8bf);font-size:13px}@keyframes review-card-shimmer{to{background-position:-220% 0}}@media(prefers-reduced-motion:reduce){#english-review-app .skeleton-line,#english-review-app .skeleton-block{animation:none}}
  </style>
  <div class="panel">
    <header class="hero"><div class="heading"><p class="kicker">Daily English Review · v0.7.0</p><h2 data-title>English Review</h2><p class="source" data-source>正在准备本次复习内容…</p><p class="metrics" data-metrics>等待题目数据…</p></div><button class="settings-button" type="button" data-action="settings" aria-label="复习卡片设置" disabled hidden>设置</button></header>
    <main class="body"><div class="skeleton" data-view="loading" role="status" aria-live="polite"><span class="skeleton-line short"></span><span class="skeleton-line medium"></span><span class="skeleton-block"></span><span class="skeleton-block"></span><span class="skeleton-block"></span><p class="skeleton-status">卡片正在加载，题目就绪后会自动显示。</p></div><div class="start" data-view="start" hidden><p data-summary>Configurable practice · Bilingual feedback</p><button class="primary" type="button" data-action="start">开始今日复习</button></div><div data-view="settings" hidden></div><div data-view="quiz" aria-live="polite" aria-busy="true" hidden></div><div data-view="result" aria-live="polite" hidden></div><div class="status" data-status role="status"></div></main>
  </div>
  <script type="module">
    const root=document.getElementById('english-review-app');let quiz=null,quizId='',generationTiming=null;const state={index:0,answers:[],locked:false,view:'start'};
    const loadingView=root.querySelector('[data-view=loading]'),startView=root.querySelector('[data-view=start]'),settingsView=root.querySelector('[data-view=settings]'),quizView=root.querySelector('[data-view=quiz]'),resultView=root.querySelector('[data-view=result]'),status=root.querySelector('[data-status]'),settingsButton=root.querySelector('[data-action=settings]');
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=v=>String(v).normalize('NFKC').toLocaleLowerCase().replace(/[“”‘’]/g,"'").replace(/[^\p{L}\p{N}']+/gu,' ').trim();
    const labels={multiple_choice:'Multiple choice · 选择题',fill_in:'Fill in the blank · 填空题',short_answer:'Short answer · 简答题'};
    const identity=candidate=>JSON.stringify([candidate.title,candidate.questions.map(q=>[q.id,q.type,q.prompt])]);
    function save(){if(!quiz||!window.openai?.setWidgetState)return;const previous=window.openai.widgetState??{};try{const pending=window.openai.setWidgetState({...previous,quiz,quizId,progress:{index:state.index,answers:state.answers,locked:state.locked,view:state.view},generationTiming});pending?.catch?.(error=>console.warn('english_review_card_save_failed',error))}catch(error){console.warn('english_review_card_save_failed',error)}}
    function show(view,persist=true){root.querySelectorAll('[data-view]').forEach(item=>item.hidden=item!==view);state.view=view.dataset.view;if(persist)save()}
    const formatDuration=ms=>ms<1000?`${Math.round(ms)} ms`:`${(ms/1000).toFixed(1)} s`;
    function reportTiming(candidate,source){requestAnimationFrame(()=>requestAnimationFrame(()=>{const saved=window.openai?.widgetState,stored=saved?.quizId===quizId?saved.generationTiming:null,generationMs=stored?.generationMs??(candidate.request_started_at_ms?Date.now()-candidate.request_started_at_ms:null);generationTiming={generationMs};root.querySelector('[data-metrics]').textContent=generationMs!==null&&generationMs>=0?`本卡生成 ${formatDuration(generationMs)}`:'本卡生成时间未提供';if(!stored)save();console.debug('english_review_card_ready',{generationMs,source})}))}
    function load(candidate,source='tool'){if(!candidate?.questions?.length)return;const nextId=identity(candidate),saved=window.openai?.widgetState;if(nextId===quizId)return;quiz=candidate;quizId=nextId;if(saved?.quizId===quizId&&saved.progress){state.index=Math.min(saved.progress.index??0,quiz.questions.length-1);state.answers=Array.isArray(saved.progress.answers)?saved.progress.answers:[];state.locked=Boolean(saved.progress.locked);state.view=['start','quiz','result'].includes(saved.progress.view)?saved.progress.view:'start';generationTiming=saved.generationTiming??null}else{state.index=0;state.answers=[];state.locked=false;state.view='start';generationTiming=null}root.querySelector('[data-title]').textContent=quiz.title;root.querySelector('[data-source]').textContent=quiz.source_summary;root.querySelector('[data-summary]').textContent=`${quiz.questions.length} questions · Configurable practice · Bilingual feedback`;quizView.setAttribute('aria-busy','false');settingsButton.disabled=false;settingsButton.hidden=false;status.textContent='';restoreView();save();reportTiming(candidate,source)}
    window.addEventListener('openai:set_globals',event=>load(event.detail?.globals?.toolOutput,'tool'));
    function preferences(){const saved=window.openai?.widgetState?.preferences,currentTypes=quiz?[...new Set(quiz.questions.map(q=>q.type))]:Object.keys(labels);return {questionCount:saved?.questionCount??quiz?.questions.length??5,questionTypes:saved?.questionTypes?.length?saved.questionTypes:currentTypes}}
    function openSettings(){if(settingsButton.disabled||settingsButton.hidden)return;const prefs=preferences();settingsView.dataset.previous=!resultView.hidden?'result':!quizView.hidden?'quiz':'start';settingsButton.disabled=true;settingsButton.hidden=true;settingsView.innerHTML=`<div class="settings"><div><p class="kicker">Review settings</p><h3>更新复习方式</h3></div><label>题目数量（至少 1 题，无上限）<input class="count" type="number" min="1" value="${prefs.questionCount}" data-setting-count></label><fieldset class="settings-group"><legend>题型</legend>${Object.entries(labels).map(([value,label])=>`<label class="check"><input type="checkbox" value="${value}" data-setting-type ${prefs.questionTypes.includes(value)?'checked':''}><span>${label}</span></label>`).join('')}</fieldset><div class="actions"><button type="button" class="secondary" data-action="cancel-settings">取消</button><button type="button" class="primary" data-action="apply-settings">更新卡片</button></div><div class="status" data-settings-status role="status"></div></div>`;show(settingsView,false)}
    function cancelSettings(){settingsButton.disabled=false;settingsButton.hidden=false;show(root.querySelector(`[data-view=${settingsView.dataset.previous}]`))}
    async function applySettings(){const count=Math.max(1,Number(settingsView.querySelector('[data-setting-count]').value)||5),types=[...settingsView.querySelectorAll('[data-setting-type]:checked')].map(input=>input.value),settingsStatus=settingsView.querySelector('[data-settings-status]');if(!types.length){settingsStatus.textContent='请至少选择一种题型。';return}if(!window.openai?.sendFollowUpMessage){settingsStatus.textContent='当前客户端不支持自动更新，请在对话中发送设置要求。';return}const button=settingsView.querySelector('[data-action=apply-settings]');button.disabled=true;settingsStatus.textContent='正在向对话提交更新请求…';const typeNames=types.map(type=>labels[type].split(' · ')[1]).join('、'),requestStartedAt=Date.now(),prompt=`这是我点击卡片“更新卡片”按钮发出的新请求：请立即调用 create_english_review_card_v2 工具一次，生成一张包含 ${count} 道题的新英语复习卡片。questions 数组必须包含全部 ${count} 道题且没有最大题数限制，只使用这些题型：${typeNames}。题目严格依据当前英语学习对话，并将 request_started_at_ms 原样设为 ${requestStartedAt}。不要只回复文字。`;try{await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});window.openai.setWidgetState?.({...(window.openai.widgetState??{}),preferences:{questionCount:count,questionTypes:types}});settingsStatus.textContent='更新请求已提交到对话，正在等待新卡片…'}catch(error){button.disabled=false;settingsStatus.textContent='未能提交更新请求，请重试。'}}
    function selected(q){if(q.type==='multiple_choice')return quizView.querySelector('input[name=answer]:checked')?.value||'';return quizView.querySelector('[data-answer]')?.value.trim()||''}
    function showFeedback(q,result){quizView.querySelectorAll('input,textarea').forEach(el=>el.disabled=true);quizView.querySelector('[data-feedback]').innerHTML=`<div class="feedback" data-correct="${result.correct}"><strong>${result.correct?'Correct! 答对了':'Keep going! 再想一想'}</strong>${result.correct?'':`<p><b>Answer:</b> ${esc(q.accepted_answers[0])}</p>`}<p>${esc(q.explanation_en)}</p><p>${esc(q.explanation_zh)}</p></div>`;quizView.querySelector('.actions').innerHTML=`<button class="primary" type="button" data-action="next">${state.index===quiz.questions.length-1?'查看成绩':'下一题'}</button>`}
    function renderQuestion(){const q=quiz.questions[state.index],total=quiz.questions.length,savedAnswer=state.answers[state.index]?.answer??'';const input=q.type==='multiple_choice'?`<fieldset>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${esc(o)}" ${o===savedAnswer?'checked':''}><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}</fieldset>`:q.type==='short_answer'?`<textarea class="text" data-answer aria-label="Your answer" placeholder="Write your answer in English…">${esc(savedAnswer)}</textarea>`:`<input class="text" data-answer aria-label="Your answer" placeholder="Type your answer…" value="${esc(savedAnswer)}">`;quizView.innerHTML=`<div class="progress-row"><span>Question ${state.index+1} of ${total}</span><span>${state.answers.filter(a=>a.correct).length} correct</span></div><div class="progress"><span style="width:${state.index/total*100}%"></span></div><div class="type">${labels[q.type]}</div><h3 class="prompt">${esc(q.prompt)}</h3>${input}<div data-feedback></div><div class="actions"><button class="primary" type="button" data-action="submit">提交答案</button></div>`;if(state.locked&&state.answers[state.index])showFeedback(q,state.answers[state.index])}
    function submit(){if(state.locked)return;const q=quiz.questions[state.index],answer=selected(q);if(!answer){quizView.querySelector('[data-answer]')?.focus();return}const correct=q.accepted_answers.some(expected=>norm(expected)===norm(answer)),result={correct,knowledgePoint:q.knowledge_point,answer};state.answers[state.index]=result;state.locked=true;showFeedback(q,result);save()}
    function renderResult(){const total=quiz.questions.length,correct=state.answers.filter(a=>a.correct).length,missed=state.answers.filter(a=>!a.correct);resultView.innerHTML=`<div class="result"><p class="kicker">Review complete</p><div class="score">${correct}/${total}</div><p>${correct===total?'Excellent — 全部答对！':'Nice work — 错题会变成下一轮练习。'}</p></div><div class="result-list">${quiz.questions.map((q,i)=>`<div class="result-item"><strong>${state.answers[i]?.correct?'✓':'○'} ${esc(q.knowledge_point)}</strong><p>${esc(q.explanation_en)} / ${esc(q.explanation_zh)}</p></div>`).join('')}</div><div class="actions"><button class="primary" type="button" data-action="followup">${missed.length?'复练错题':'再来一组'}</button></div>`}
    function restoreView(){if(state.view==='result'){renderResult();show(resultView,false)}else if(state.view==='quiz'){renderQuestion();show(quizView,false)}else show(startView,false)}
    async function followup(){const missed=state.answers.filter(a=>!a.correct),prefs=preferences(),questionCount=missed.length||prefs.questionCount,typeNames=prefs.questionTypes.map(type=>labels[type].split(' · ')[1]).join('、'),requestStartedAt=Date.now(),base=`请立即调用 create_english_review_card_v2 工具一次，生成一张包含 ${questionCount} 道题的新英语复习卡片。questions 数组必须包含全部题目且没有最大题数限制，只使用这些题型：${typeNames}，并将 request_started_at_ms 原样设为 ${requestStartedAt}。`,prompt=missed.length?`${base}题目数量必须等于本轮 ${missed.length} 道错题的数量，并只围绕这些错题知识点生成不同题目：${missed.map(a=>a.knowledgePoint).join('；')}。题目仍须严格依据当前英语学习对话，不要重复原题措辞，也不要只回复文字。`:`${base}根据当前英语学习对话生成不同题目，不要重复原题措辞，也不要只回复文字。`;if(!window.openai?.sendFollowUpMessage){status.textContent='请在对话中输入“复练错题”。';return}status.textContent='正在向对话提交复练请求…';try{await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});status.textContent='复练请求已提交，正在等待新卡片…'}catch(error){status.textContent='未能提交复练请求，请重试。'}}
    root.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(action==='settings')openSettings();if(action==='cancel-settings')cancelSettings();if(action==='apply-settings')applySettings();if(action==='start'){if(!quiz){status.textContent='题目仍在加载，请稍候。';return}state.locked=false;show(quizView);renderQuestion()}if(action==='submit')submit();if(action==='next'){state.index+=1;state.locked=false;if(state.index<quiz.questions.length){renderQuestion();save()}else{state.view='result';renderResult();show(resultView)}}if(action==='followup')followup()});
    window.openai?.toolOutput?load(window.openai.toolOutput,'tool'):load(window.openai?.widgetState?.quiz,'cache');
  </script>
</div>
