<div id="english-review-app" aria-label="English review card">
  <style>
    #english-review-app{color-scheme:light dark;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#172033,#eef2ff);width:100%;margin:0}#english-review-app *{box-sizing:border-box}#english-review-app .panel{display:flex;min-height:680px;flex-direction:column;background:light-dark(#fff,#171a23);border:1px solid light-dark(#dce2ee,#343948);border-radius:20px;overflow:hidden}#english-review-app .hero{padding:24px;background:light-dark(linear-gradient(135deg,#f7f9ff,#eef2ff),linear-gradient(135deg,#1d2230,#202640))}#english-review-app .kicker{margin:0 0 8px;color:light-dark(#315cff,#9fb2ff);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}#english-review-app h2{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.2}#english-review-app .source{margin:10px 0 0;color:light-dark(#5e687c,#b4bdd1);font-size:14px;line-height:1.55}#english-review-app .body{display:flex;flex:1;flex-direction:column;padding:24px}#english-review-app .start{display:grid;gap:18px;margin:auto;text-align:center}#english-review-app button{font:inherit;min-height:44px;border-radius:12px;padding:11px 18px;font-weight:500;cursor:pointer}#english-review-app .primary{border:0;color:#fff;background:#315cff}#english-review-app .primary:disabled{cursor:default;opacity:.55}#english-review-app .progress-row{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;color:light-dark(#5e687c,#b4bdd1);font-size:13px}#english-review-app .progress{height:7px;background:light-dark(#e7ebf3,#2a3040);border-radius:99px;overflow:hidden;margin-bottom:22px}#english-review-app .progress span{display:block;height:100%;background:#315cff}#english-review-app .type{color:light-dark(#315cff,#9fb2ff);font-size:12px;font-weight:500}#english-review-app .prompt{margin:8px 0 18px;font-size:20px;line-height:1.45}#english-review-app fieldset{display:grid;gap:10px;border:0;padding:0;margin:0 0 18px}#english-review-app .option{display:flex;gap:10px;padding:12px 14px;border:1px solid light-dark(#d7ddea,#41485a);border-radius:12px;cursor:pointer;line-height:1.4}#english-review-app .option:has(input:checked){border-color:#315cff;background:light-dark(#f1f4ff,#242c49)}#english-review-app input[type=radio]{margin-top:3px;accent-color:#315cff}#english-review-app .text{width:100%;min-height:46px;border:1px solid light-dark(#cfd6e5,#4a5266);border-radius:12px;padding:11px 13px;color:inherit;background:light-dark(#fff,#11141c);font:inherit;font-size:16px;margin-bottom:18px}#english-review-app textarea.text{min-height:92px;resize:vertical}#english-review-app .feedback{margin:16px 0;padding:14px;border-radius:12px;line-height:1.5}#english-review-app .feedback[data-correct=true]{background:light-dark(#eaf8f0,#173428);border:1px solid light-dark(#a9dfbe,#286846)}#english-review-app .feedback[data-correct=false]{background:light-dark(#fff0ef,#402221);border:1px solid light-dark(#f0b5b0,#7c3d39)}#english-review-app .feedback p{margin:5px 0}#english-review-app .actions{display:flex;justify-content:flex-end;gap:10px}#english-review-app .result{text-align:center;padding:8px 0 20px}#english-review-app .score{font-size:48px;font-weight:500;margin:8px 0 30px}#english-review-app .result-list{display:grid;gap:10px;text-align:left;margin:22px 0}#english-review-app .result-item{padding:12px 14px;border:1px solid light-dark(#dce2ee,#343948);border-radius:12px}#english-review-app .result-item p{margin:5px 0 0;color:light-dark(#5e687c,#b4bdd1);font-size:13px}#english-review-app .status{min-height:20px;margin-top:10px;color:light-dark(#5e687c,#b4bdd1);font-size:13px}#english-review-app [hidden]{display:none!important}@media(max-width:480px){#english-review-app .panel{min-height:720px}#english-review-app .hero,#english-review-app .body{padding:18px}#english-review-app .actions{flex-direction:column}#english-review-app .actions button{width:100%}}
    #english-review-app .panel{min-height:0}#english-review-app .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}#english-review-app .heading{min-width:0}#english-review-app .settings-button{flex:0 0 auto;min-height:40px;border:1px solid light-dark(#cfd6e5,#4a5266);padding:9px 14px;color:inherit;background:light-dark(rgba(255,255,255,.72),rgba(17,20,28,.62))}#english-review-app .settings{display:grid;gap:22px}#english-review-app .settings h3{margin:0;font-size:22px}#english-review-app .settings-group{display:grid;gap:10px;border:0;margin:0;padding:0}#english-review-app .settings-group legend{margin-bottom:10px;font-weight:600}#english-review-app .check{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid light-dark(#d7ddea,#41485a);border-radius:12px}#english-review-app .check input{width:18px;height:18px;accent-color:#315cff}#english-review-app .count{display:block;width:100%;min-height:46px;margin-top:8px;border:1px solid light-dark(#cfd6e5,#4a5266);border-radius:12px;padding:10px 12px;color:inherit;background:light-dark(#fff,#11141c);font:inherit;font-size:16px}#english-review-app .secondary{border:1px solid light-dark(#cfd6e5,#4a5266);color:inherit;background:transparent}
  </style>
  <div class="panel">
    <header class="hero"><div class="heading"><p class="kicker">Daily English Review</p><h2 data-title>English Review</h2><p class="source" data-source></p></div><button class="settings-button" type="button" data-action="settings" aria-label="复习卡片设置">设置</button></header>
    <main class="body"><div class="start" data-view="start"><p data-summary>Configurable practice · Bilingual feedback</p><button class="primary" type="button" data-action="start">开始今日复习</button></div><div data-view="settings" hidden></div><div data-view="quiz" aria-live="polite" hidden></div><div data-view="result" aria-live="polite" hidden></div><div class="status" data-status role="status"></div></main>
  </div>
  <script type="module">
    const root=document.getElementById('english-review-app');let quiz=null;const state={index:0,answers:[],locked:false};
    const startView=root.querySelector('[data-view=start]'),settingsView=root.querySelector('[data-view=settings]'),quizView=root.querySelector('[data-view=quiz]'),resultView=root.querySelector('[data-view=result]'),status=root.querySelector('[data-status]');
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const norm=v=>String(v).normalize('NFKC').toLocaleLowerCase().replace(/[“”‘’]/g,"'").replace(/[^\p{L}\p{N}']+/gu,' ').trim();
    const labels={multiple_choice:'Multiple choice · 选择题',fill_in:'Fill in the blank · 填空题',short_answer:'Short answer · 简答题'};
    function load(candidate){if(!candidate?.questions)return;quiz=candidate;root.querySelector('[data-title]').textContent=quiz.title;root.querySelector('[data-source]').textContent=quiz.source_summary;root.querySelector('[data-summary]').textContent=`${quiz.questions.length} questions · Configurable practice · Bilingual feedback`;status.textContent=''}
    load(window.openai?.toolOutput);
    window.addEventListener('openai:set_globals',event=>load(event.detail?.globals?.toolOutput));
    function show(view){root.querySelectorAll('[data-view]').forEach(item=>item.hidden=item!==view)}
    function preferences(){const saved=window.openai?.widgetState?.preferences,currentTypes=quiz?[...new Set(quiz.questions.map(q=>q.type))]:Object.keys(labels);return {questionCount:saved?.questionCount??quiz?.questions.length??5,questionTypes:saved?.questionTypes?.length?saved.questionTypes:currentTypes}}
    function openSettings(){const prefs=preferences();settingsView.dataset.previous=!resultView.hidden?'result':!quizView.hidden?'quiz':'start';settingsView.innerHTML=`<div class="settings"><div><p class="kicker">Review settings</p><h3>更新复习方式</h3></div><label>题目数量（1–20）<input class="count" type="number" min="1" max="20" value="${prefs.questionCount}" data-setting-count></label><fieldset class="settings-group"><legend>题型</legend>${Object.entries(labels).map(([value,label])=>`<label class="check"><input type="checkbox" value="${value}" data-setting-type ${prefs.questionTypes.includes(value)?'checked':''}><span>${label}</span></label>`).join('')}</fieldset><div class="actions"><button type="button" class="secondary" data-action="cancel-settings">取消</button><button type="button" class="primary" data-action="apply-settings">更新卡片</button></div><div class="status" data-settings-status role="status"></div></div>`;show(settingsView)}
    async function applySettings(){const count=Math.max(1,Math.min(20,Number(settingsView.querySelector('[data-setting-count]').value)||5)),types=[...settingsView.querySelectorAll('[data-setting-type]:checked')].map(input=>input.value),settingsStatus=settingsView.querySelector('[data-settings-status]');if(!types.length){settingsStatus.textContent='请至少选择一种题型。';return}const nextState={...(window.openai?.widgetState??{}),preferences:{questionCount:count,questionTypes:types}};window.openai?.setWidgetState?.(nextState);if(!window.openai?.sendFollowUpMessage){settingsStatus.textContent='请在对话中告诉 ChatGPT 题型和数量。';return}const button=settingsView.querySelector('[data-action=apply-settings]');button.disabled=true;settingsStatus.textContent='正在按新设置生成…';const typeNames=types.map(type=>labels[type].split(' · ')[1]).join('、'),prompt=`必须再次调用 create_english_review_card，生成一张新的英语复习卡片。仅调用该工具一次，并在同一次调用的 questions 数组中放入全部 ${count} 道题；不要拆成多张卡片，也不要只回复文字。只使用这些题型：${typeNames}。题目必须严格依据当前英语学习对话。`;try{await window.openai.sendFollowUpMessage({prompt});settingsStatus.textContent='设置已保存并发送。'}catch(error){button.disabled=false;settingsStatus.textContent='更新失败，请稍后重试。'}}
    function selected(q){if(q.type==='multiple_choice')return quizView.querySelector('input[name=answer]:checked')?.value||'';return quizView.querySelector('[data-answer]')?.value.trim()||''}
    function renderQuestion(){const q=quiz.questions[state.index],total=quiz.questions.length;const input=q.type==='multiple_choice'?`<fieldset>${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${esc(o)}"><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}</fieldset>`:q.type==='short_answer'?'<textarea class="text" data-answer aria-label="Your answer" placeholder="Write your answer in English…"></textarea>':'<input class="text" data-answer aria-label="Your answer" placeholder="Type your answer…">';quizView.innerHTML=`<div class="progress-row"><span>Question ${state.index+1} of ${total}</span><span>${state.answers.filter(a=>a.correct).length} correct</span></div><div class="progress"><span style="width:${state.index/total*100}%"></span></div><div class="type">${labels[q.type]}</div><h3 class="prompt">${esc(q.prompt)}</h3>${input}<div data-feedback></div><div class="actions"><button class="primary" type="button" data-action="submit">提交答案</button></div>`;state.locked=false}
    function submit(){if(state.locked)return;const q=quiz.questions[state.index],answer=selected(q);if(!answer){quizView.querySelector('[data-answer]')?.focus();return}const correct=q.accepted_answers.some(expected=>norm(expected)===norm(answer));state.answers.push({correct,knowledgePoint:q.knowledge_point});state.locked=true;quizView.querySelectorAll('input,textarea').forEach(el=>el.disabled=true);quizView.querySelector('[data-feedback]').innerHTML=`<div class="feedback" data-correct="${correct}"><strong>${correct?'Correct! 答对了':'Keep going! 再想一想'}</strong>${correct?'':`<p><b>Answer:</b> ${esc(q.accepted_answers[0])}</p>`}<p>${esc(q.explanation_en)}</p><p>${esc(q.explanation_zh)}</p></div>`;quizView.querySelector('.actions').innerHTML=`<button class="primary" type="button" data-action="next">${state.index===quiz.questions.length-1?'查看成绩':'下一题'}</button>`}
    function renderResult(){quizView.hidden=true;resultView.hidden=false;const total=quiz.questions.length,correct=state.answers.filter(a=>a.correct).length,missed=state.answers.filter(a=>!a.correct);resultView.innerHTML=`<div class="result"><p class="kicker">Review complete</p><div class="score">${correct}/${total}</div><p>${correct===total?'Excellent — 全部答对！':'Nice work — 错题会变成下一轮练习。'}</p></div><div class="result-list">${quiz.questions.map((q,i)=>`<div class="result-item"><strong>${state.answers[i].correct?'✓':'○'} ${esc(q.knowledge_point)}</strong><p>${esc(q.explanation_en)} / ${esc(q.explanation_zh)}</p></div>`).join('')}</div><div class="actions"><button class="primary" type="button" data-action="followup">${missed.length?'复练错题':'再来一组'}</button></div>`}
    async function followup(){const missed=state.answers.filter(a=>!a.correct),prefs=preferences(),typeNames=prefs.questionTypes.map(type=>labels[type].split(' · ')[1]).join('、'),base=`必须再次调用 create_english_review_card，生成一张新的英语复习卡片。仅调用该工具一次，并在同一次调用的 questions 数组中放入全部 ${prefs.questionCount} 道题；不要拆成多张卡片，也不要只回复文字。只使用这些题型：${typeNames}。`,prompt=missed.length?`${base}只围绕这些错题知识点生成不同题目：${missed.map(a=>a.knowledgePoint).join('；')}。题目仍须严格依据当前英语学习对话，不要重复原题措辞。`:`${base}根据当前英语学习对话生成不同题目，不要重复原题措辞。`;if(!window.openai?.sendFollowUpMessage){status.textContent='请在对话中输入“复练错题”。';return}status.textContent='正在生成新的复习卡片…';try{await window.openai.sendFollowUpMessage({prompt,title:missed.length?'生成错题复练卡片':'再生成一张复习卡片'});status.textContent='复练请求已发送。'}catch(error){status.textContent='生成失败，请稍后重试。'}}
    root.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(action==='settings')openSettings();if(action==='cancel-settings')show(root.querySelector(`[data-view=${settingsView.dataset.previous}]`));if(action==='apply-settings')applySettings();if(action==='start'){if(!quiz){status.textContent='题目仍在加载，请稍候。';return}show(quizView);renderQuestion()}if(action==='submit')submit();if(action==='next'){state.index+=1;state.index<quiz.questions.length?renderQuestion():renderResult()}if(action==='followup')followup()});
  </script>
</div>
