<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语复习卡流程图</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f4f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#172033}.canvas{width:1920px;height:1080px;padding:92px 105px;background:radial-gradient(circle at 85% 15%,#dfe5ff,transparent 32%),#f7f8ff}.tag{color:#315cff;font-size:28px;font-weight:800;letter-spacing:.12em}.title{margin:20px 0 65px;font-size:68px;letter-spacing:-.03em}.row{display:flex;align-items:stretch;gap:28px}.card{flex:1;min-height:420px;padding:40px;border-radius:34px;background:#fff;border:2px solid #e0e5f3;box-shadow:0 20px 55px rgba(35,52,90,.09)}.icon{display:grid;place-items:center;width:75px;height:75px;border-radius:22px;background:#315cff;color:#fff;font-size:34px;font-weight:800}.card h2{margin:34px 0 16px;font-size:36px}.card p{margin:0;color:#647087;font-size:25px;line-height:1.55}.arrow{align-self:center;color:#315cff;font-size:48px;font-weight:800}.footer{display:flex;justify-content:space-between;margin-top:55px;font-size:25px;color:#667188}.footer strong{color:#315cff}</style></head><body><main class="canvas"><div class="tag">ENGLISH REVIEW CARD · CODEX SKILL</div><h1 class="title">从定时学习，到错题复练</h1><div class="row"><article class="card"><div class="icon">1</div><h2>定时学习</h2><p>每天固定时间提醒，降低开始学习的阻力。</p></article><div class="arrow">→</div><article class="card"><div class="icon">2</div><h2>真实对话</h2><p>学习词汇、语法、口语或阅读材料。</p></article><div class="arrow">→</div><article class="card"><div class="icon">3</div><h2>生成复习卡</h2><p>说“学完了”，只根据当前学习内容出题。</p></article><div class="arrow">→</div><article class="card"><div class="icon">4</div><h2>错题复练</h2><p>围绕错题知识点换一种问法，再练一次。</p></article></div><div class="footer"><span>选择题 · 填空题 · 简答题 · 中英双语解析</span><strong>刚学刚练，形成闭环</strong></div></main></body></html>
