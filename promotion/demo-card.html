<div class="erc-panel"><header class="erc-hero"><div class="erc-heading"><p class="erc-kicker">Daily English Review · v0.8.0</p><h2>Today&#x27;s English Review</h2><p class="erc-source">今天学习的机场英语：办理登机、行李托运与礼貌提问</p><p class="erc-metrics" data-metrics>等待题目数据…</p></div><button type="button" class="erc-settings-button" data-action="settings" aria-label="复习卡片设置" disabled hidden>设置</button></header><div class="erc-body"><div data-view="loading" class="erc-skeleton" role="status" aria-live="polite"><span class="erc-skeleton-line short"></span><span class="erc-skeleton-line medium"></span><span class="erc-skeleton-block"></span><span class="erc-skeleton-block"></span><span class="erc-skeleton-block"></span><p class="erc-skeleton-status">卡片正在加载，题目就绪后会自动显示。</p></div><div data-view="start" class="erc-start" hidden><p>5 questions · Configurable practice · Bilingual feedback</p><button type="button" class="erc-primary" data-action="start">开始今日复习</button></div><div data-view="settings" hidden></div><div data-view="quiz" aria-live="polite" aria-busy="true" hidden></div><div data-view="result" aria-live="polite" hidden></div></div></div>
<script>(()=>{const root=document.getElementById("english-review-8de4cea312"),quiz={"title":"Today's English Review","source_summary":"今天学习的机场英语：办理登机、行李托运与礼貌提问","questions":[{"id":"q1","type":"multiple_choice","knowledge_point":"check in for a flight","prompt":"Which sentence means ‘办理登机手续’？","options":["Check in for a flight","Check out a suitcase","Pick up a passport"],"accepted_answers":["Check in for a flight"],"explanation_en":"Check in for a flight means to register at the airport before boarding.","explanation_zh":"Check in for a flight 指在登机前办理值机手续。"},{"id":"q2","type":"fill_in","knowledge_point":"checked baggage","prompt":"I would like to ___ this suitcase.","accepted_answers":["check"],"explanation_en":"Check a suitcase means to hand it over as checked baggage.","explanation_zh":"Check a suitcase 表示把行李办理托运。"},{"id":"q3","type":"short_answer","knowledge_point":"polite airport requests","prompt":"Politely ask where the boarding gate is.","accepted_answers":["Could you tell me where the boarding gate is?","Could you tell me where my gate is?"],"grading_guidance":"Accept a grammatically clear and polite request asking for the location of the boarding gate.","explanation_en":"Could you tell me… is a polite way to ask airport staff for help.","explanation_zh":"Could you tell me… 是向机场工作人员礼貌求助的表达。"},{"id":"q4","type":"multiple_choice","knowledge_point":"baggage claim","prompt":"Where do you collect your suitcase after landing?","options":["At baggage claim","At the boarding gate","At security"],"accepted_answers":["At baggage claim"],"explanation_en":"Baggage claim is the area where arriving passengers collect checked luggage.","explanation_zh":"Baggage claim 是抵达后领取托运行李的区域。"},{"id":"q5","type":"fill_in","knowledge_point":"aisle seat","prompt":"Could I have an ___ seat, please?","accepted_answers":["aisle"],"explanation_en":"An aisle seat is next to the passage through the cabin.","explanation_zh":"Aisle seat 指靠近机舱过道的座位。"}]},state={index:0,answers:[],locked:false},startView=root.querySelector('[data-view="start"]'),quizView=root.querySelector('[data-view="quiz"]'),resultView=root.querySelector('[data-view="result"]'),settingsButton=root.querySelector('[data-action="settings"]');const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=v=>String(v).normalize('NFKC').toLocaleLowerCase().replace(/[“”‘’]/g,"'").replace(/[^\p{L}\p{N}']+/gu,' ').trim();const editDistance=(a,b)=>{const row=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let previous=row[0];row[0]=i;for(let j=1;j<=b.length;j++){const saved=row[j];row[j]=Math.min(row[j]+1,row[j-1]+1,previous+(a[i-1]===b[j-1]?0:1));previous=saved}}return row[b.length]};const spellingScore=(expected,answer)=>{const left=norm(expected).split(' ').filter(Boolean),right=norm(answer).split(' ').filter(Boolean);if(!left.length||left.length!==right.length)return 0;return Math.min(...left.map((word,index)=>1-editDistance(word,right[index])/Math.max(word.length,right[index].length,1)))};const grade=(q,answer)=>{const exact=q.accepted_answers.find(expected=>norm(expected)===norm(answer));if(exact)return{correct:true,approximate:false,similarity:1,expected:exact};if(q.type==='multiple_choice')return{correct:false,approximate:false,similarity:0,expected:q.accepted_answers[0]};const candidates=q.accepted_answers.map(expected=>({expected,similarity:spellingScore(expected,answer)})).sort((a,b)=>b.similarity-a.similarity),best=candidates[0];return{correct:best.similarity>=.8,approximate:best.similarity>=.8,similarity:best.similarity,expected:best.expected}};const labels={multiple_choice:'Multiple choice · 选择题',fill_in:'Fill in the blank · 填空题',short_answer:'Short answer · 简答题'};
function show(view){root.querySelectorAll('[data-view]').forEach(item=>item.hidden=item!==view)}
function openSettings(){if(settingsButton.disabled||settingsButton.hidden)return;const settingsView=root.querySelector('[data-view="settings"]'),currentTypes=[...new Set(quiz.questions.map(q=>q.type))];settingsView.dataset.previous=!resultView.hidden?'result':!quizView.hidden?'quiz':'start';settingsButton.disabled=true;settingsButton.hidden=true;settingsView.innerHTML=`<div class="erc-settings"><div><p class="erc-kicker">Review settings</p><h3>更新复习方式</h3></div><label>题目数量（至少 1 题，无上限）<input class="erc-count" type="number" min="1" value="${quiz.questions.length}" data-setting-count></label><fieldset class="erc-settings-group"><legend>题型</legend>${Object.entries(labels).map(([value,label])=>`<label class="erc-check"><input type="checkbox" value="${value}" data-setting-type ${currentTypes.includes(value)?'checked':''}><span>${label}</span></label>`).join('')}</fieldset><div class="erc-actions"><button type="button" class="erc-secondary" data-action="cancel-settings">取消</button><button type="button" class="erc-primary" data-action="apply-settings">更新卡片</button></div><div class="erc-status" role="status"></div></div>`;show(settingsView)}
function cancelSettings(){settingsButton.disabled=false;settingsButton.hidden=false;show(root.querySelector(`[data-view="${root.querySelector('[data-view="settings"]').dataset.previous}"]`))}
async function applySettings(){const settingsView=root.querySelector('[data-view="settings"]'),count=Math.max(1,Number(settingsView.querySelector('[data-setting-count]').value)||quiz.questions.length),types=[...settingsView.querySelectorAll('[data-setting-type]:checked')].map(input=>input.value),status=settingsView.querySelector('.erc-status');if(!types.length){status.textContent='请至少选择一种题型。';return}if(!window.openai?.sendFollowUpMessage){status.textContent='当前客户端不支持更新，请在对话中告诉 Codex 题型和数量。';return}const button=settingsView.querySelector('[data-action="apply-settings"]');button.disabled=true;status.textContent='正在向对话提交更新请求…';const typeNames=types.map(type=>labels[type].split(' · ')[1]).join('、'),requestStartedAt=Date.now(),prompt=`这是我点击卡片“更新卡片”按钮发出的新请求：使用 $english-review-card 根据当前英语学习对话重新生成一张包含 ${count} 道题的复习卡片，只使用这些题型：${typeNames}，并将 request_started_at_ms 原样设为 ${requestStartedAt}。请立即执行，不要只回复文字。`;try{await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});status.textContent='更新请求已提交到对话，正在等待新卡片…'}catch(error){button.disabled=false;status.textContent='未能提交更新请求，请重试。'}}
function selected(q){if(q.type==='multiple_choice')return quizView.querySelector('input[name="erc-answer"]:checked')?.value||'';return quizView.querySelector('[data-answer-input]')?.value.trim()||''}
function renderQuestion(){const q=quiz.questions[state.index],total=quiz.questions.length;const input=q.type==='multiple_choice'?`<fieldset class="erc-options">${q.options.map((o,i)=>`<label class="erc-option"><input type="radio" name="erc-answer" value="${esc(o)}"><span>${String.fromCharCode(65+i)}. ${esc(o)}</span></label>`).join('')}</fieldset>`:q.type==='short_answer'?'<textarea class="erc-text" data-answer-input aria-label="Your answer" placeholder="Write your answer in English…"></textarea>':'<input class="erc-text" data-answer-input aria-label="Your answer" placeholder="Type your answer…">';quizView.innerHTML=`<div class="erc-progress-row"><span>Question ${state.index+1} of ${total}</span><span>${state.answers.filter(a=>a.correct).length} correct</span></div><div class="erc-progress" aria-hidden="true"><span style="width:${state.index/total*100}%"></span></div><div class="erc-type">${labels[q.type]}</div><h3 class="erc-prompt">${esc(q.prompt)}</h3>${input}<div data-feedback></div><div class="erc-actions"><button type="button" class="erc-primary" data-action="submit">提交答案</button></div>`;state.locked=false}
function submit(){if(state.locked)return;const q=quiz.questions[state.index],answer=selected(q);if(!answer){quizView.querySelector('[data-answer-input]')?.focus();return}const result=grade(q,answer),needsReview=q.type==='short_answer'&&!result.correct,correct=result.correct;state.answers.push({id:q.id,answer,correct,needsReview,reviewRequested:false,approximate:result.approximate,similarity:result.similarity,knowledgePoint:q.knowledge_point,prompt:q.prompt});state.locked=true;quizView.querySelectorAll('input,textarea').forEach(el=>el.disabled=true);const spelling=result.approximate?`<p><b>Spelling note · 拼写提示:</b> ${Math.round(result.similarity*100)}% similar; recommended spelling: ${esc(result.expected)}</p>`:'',heading=needsReview?'Needs semantic review · 需要语义复核':correct?'Correct! 答对了':'Keep going! 再想一想',answerLine=!correct&&!needsReview?`<p><b>Answer:</b> ${esc(q.accepted_answers[0])}</p>`:'';quizView.querySelector('[data-feedback]').innerHTML=`<div class="erc-feedback" data-correct="${correct}"><strong>${result.approximate?'Correct with a spelling note! 拼写近似，按正确计':heading}</strong>${answerLine}${needsReview?'<p>本地规则无法可靠判断这个表达；你可以交给当前对话中的模型依据评分指导复核。</p>':''}${spelling}<p>${esc(q.explanation_en)}</p><p>${esc(q.explanation_zh)}</p></div>`;quizView.querySelector('.erc-actions').innerHTML=`${needsReview?'<button type="button" class="erc-secondary" data-action="model-review">请模型复核</button>':''}<button type="button" class="erc-primary" data-action="next">${state.index===quiz.questions.length-1?'查看成绩':'下一题'}</button>`;quizView.querySelector(needsReview?'[data-action="model-review"]':'[data-action="next"]')?.focus()}
async function requestModelReview(){const q=quiz.questions[state.index],entry=state.answers[state.index],button=quizView.querySelector('[data-action="model-review"]');if(!entry?.needsReview||entry.reviewRequested)return;if(!window.openai?.sendFollowUpMessage){button.textContent='请在对话中粘贴答案请求复核';return}button.disabled=true;button.textContent='正在请求复核…';const guidance=q.grading_guidance||'Judge whether the answer conveys the same correct meaning as the reference answers.',prompt=`请仅复核下面这道英语简答题，不要生成新卡片。题目：${q.prompt}
知识点：${q.knowledge_point}
评分指导：${guidance}
学习者答案：${entry.answer}
参考表达仅供比较：${q.accepted_answers.join(' / ')}
请明确回答“正确”或“需要改进”，简要解释语义与关键语言问题；措辞不同但含义正确时应判为正确。`;try{await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});entry.reviewRequested=true;button.textContent='已提交，结果见对话'}catch(error){button.disabled=false;button.textContent='重试模型复核'}}
function renderResult(){quizView.hidden=true;resultView.hidden=false;const total=quiz.questions.length,correctCount=state.answers.filter(a=>a.correct).length,missed=state.answers.filter(a=>!a.correct),detail=quiz.questions.map((q,i)=>`<div class="erc-result-item"><strong>${state.answers[i].correct?'✓':'○'} ${esc(q.knowledge_point)}</strong><p>${esc(q.explanation_en)} / ${esc(q.explanation_zh)}</p></div>`).join('');resultView.innerHTML=`<div class="erc-result"><p class="erc-kicker">Review complete</p><div class="erc-score">${correctCount}/${total}</div><p>${correctCount===total?'Excellent — 全部答对！':'Nice work — 错题会变成下一轮练习。'}</p></div><div class="erc-result-list">${detail}</div><div class="erc-actions"><button type="button" class="erc-primary" data-action="followup">${missed.length?'复练错题':'再来一组'}</button></div><div class="erc-status" role="status"></div>`}
async function followup(){const missed=state.answers.filter(a=>!a.correct),types=[...new Set(quiz.questions.map(q=>labels[q.type].split(' · ')[1]))].join('、'),requestStartedAt=Date.now(),questionCount=missed.length||quiz.questions.length,config=`生成 ${questionCount} 道题，只使用这些题型：${types}，并将 request_started_at_ms 原样设为 ${requestStartedAt}。`,prompt=missed.length?`使用 $english-review-card 再生成一轮不同的英语复习题。题目数量必须等于本轮 ${missed.length} 道错题的数量。${config}只围绕这些错题知识点：${missed.map(a=>a.knowledgePoint).join('；')}。依据仍限于当前学习对话，不要重复原题措辞。`:`使用 $english-review-card 根据当前学习对话再生成一组不同的英语复习题。${config}不要重复原题措辞。`,status=resultView.querySelector('.erc-status');if(!window.openai?.sendFollowUpMessage){status.textContent='当前客户端不支持跟进消息，请在对话中输入“复练错题”。';return}const button=resultView.querySelector('[data-action="followup"]');button.disabled=true;status.textContent='正在向对话提交复练请求…';try{await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});status.textContent='复练请求已提交，正在等待新卡片…'}catch(error){button.disabled=false;status.textContent='未能提交复练请求，请重试。'}}
function next(){state.index+=1;state.index<quiz.questions.length?renderQuestion():renderResult()}root.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(action==='settings')openSettings();if(action==='cancel-settings')cancelSettings();if(action==='apply-settings')applySettings();if(action==='start'){show(quizView);renderQuestion()}if(action==='submit')submit();if(action==='model-review')requestModelReview();if(action==='next')next();if(action==='followup')followup()});root.addEventListener('keydown',event=>{if(event.key!=='Enter'||event.shiftKey||quizView.hidden||event.target.closest('button'))return;if(!event.target.closest('[data-view="quiz"]'))return;event.preventDefault();state.locked?next():submit()});requestAnimationFrame(()=>requestAnimationFrame(()=>{const generationMs=quiz.request_started_at_ms?Date.now()-quiz.request_started_at_ms:null,format=ms=>ms<1000?`${Math.round(ms)} ms`:`${(ms/1000).toFixed(1)} s`;root.querySelector('[data-metrics]').textContent=generationMs!==null&&generationMs>=0?`本卡生成 ${format(generationMs)}`:'本卡生成时间未提供';quizView.setAttribute('aria-busy','false');settingsButton.disabled=false;settingsButton.hidden=false;show(startView)}))})();</script></section>
