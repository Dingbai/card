name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify both review-card surfaces
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test local skill
        run: python3 -m unittest discover -s english-review-card/tests -v

      - name: Test task tooling
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chatgpt-app/package-lock.json

      - name: Install app dependencies
        working-directory: chatgpt-app
        run: npm ci

      - name: Type-check app
        working-directory: chatgpt-app
        run: npm run check

      - name: Test app
        working-directory: chatgpt-app
        run: npm test

  deploy-production:
    name: Deploy Vercel production
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: chatgpt-app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: chatgpt-app/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_URL; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production setting: $name" >&2
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.1

      - name: Record current production deployment
        id: previous
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1")"
          deployment_id="$(jq -r '.deployments[0].uid // empty' <<<"$response")"
          if [ -z "$deployment_id" ]; then
            echo "No READY production deployment is available for rollback." >&2
            exit 1
          fi
          production_url="${PRODUCTION_URL%/}"
          previous_health="$(curl --fail-with-body --silent --show-error "$production_url/api/health")"
          previous_version="$(jq -er '.version | select(type == "string" and length > 0)' <<<"$previous_health")"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "version=$previous_version" >> "$GITHUB_OUTPUT"

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifact
        id: deploy
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Record new production deployment
        id: deployed
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          deployment="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/$deployment_host?teamId=$VERCEL_ORG_ID")"
          deployment_id="$(jq -er '.id | select(type == "string" and length > 0)' <<<"$deployment")"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Verify production health
        id: health
        run: npm run verify:deployment -- "$PRODUCTION_URL"

      - name: Smoke-test production MCP
        id: smoke
        run: |
          set -euo pipefail
          endpoint="${PRODUCTION_URL%/}/api/mcp-v2"
          for attempt in 1 2 3 4 5; do
            if npm run smoke -- "$endpoint"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 10
            fi
          done
          echo "MCP smoke check failed after 5 attempts." >&2
          exit 1

      - name: Roll back failed production deployment
        if: failure() && steps.deploy.outcome == 'success'
        run: vercel rollback "${{ steps.previous.outputs.deployment_id }}" --yes --token="$VERCEL_TOKEN"

      - name: Verify restored production version
        if: failure() && steps.deploy.outcome == 'success'
        run: npm run verify:deployment -- "$PRODUCTION_URL" --expected-version "${{ steps.previous.outputs.version }}"

      - name: Write deployment summary
        if: always()
        working-directory: .
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.deployed.outputs.deployment_id }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          {
            echo "## Vercel production deployment"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not created}"
            echo "- Deployment ID: \`${DEPLOYMENT_ID:-not created}\`"
            echo "- Previous deployment ID: \`${PREVIOUS_DEPLOYMENT_ID:-not recorded}\`"
            echo "- Job result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
